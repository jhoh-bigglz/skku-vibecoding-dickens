<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Covent Garden, 1830s</title>
<meta name="description" content="Covent Garden, 1830s — a schematic 3D reconstruction from Dickens's 'The Streets—Morning' (prototype, v2: detailed, animated figures)">
<style>
  :root{
    --ink:#f3ede2; --ink-dim:#cfc6b6; --panel:rgba(24,22,20,.78); --line:rgba(255,255,255,.14);
    --accent:#e2b866; --market:#7a5a40; --crowd1:#b8453a; --crowd2:#2f5f8f; --police:#1f2a44;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#15171c;color:var(--ink);
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Apple SD Gothic Neo","Noto Sans KR",serif;}
  #app{position:fixed;inset:0;}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  header{position:absolute;top:0;left:0;right:0;padding:12px 16px 22px;pointer-events:none;
    text-shadow:0 1px 3px rgba(0,0,0,.7);background:linear-gradient(rgba(12,12,14,.62),rgba(12,12,14,.35) 65%,rgba(12,12,14,0))}
  header h1{margin:0;font-size:20px;line-height:1.25;font-weight:600;letter-spacing:.2px;max-width:780px}
  header h1 .sub{display:block;font-size:14px;font-weight:400;color:var(--ink-dim);font-style:italic;margin-top:2px}
  #labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .lbl{position:absolute;left:0;top:0;white-space:nowrap;padding:3px 7px 4px;border-radius:4px;
    background:rgba(250,244,232,.92);color:#2a2420;font-size:13px;line-height:1.15;
    box-shadow:0 1px 4px rgba(0,0,0,.35);will-change:transform}
  .lbl b{font-weight:700}
  .lbl small{display:block;font-size:11px;color:#5a5048}
  .lbl.minor{background:rgba(30,28,26,.72);color:#efe6d6;font-style:italic;font-size:12px;padding:2px 6px}
  .stem{position:absolute;left:0;top:0;width:1px;background:rgba(250,244,232,.85);will-change:transform}
  .dot{position:absolute;left:0;top:0;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#fff3d6;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
  #compass{position:absolute;right:16px;top:74px;width:44px;height:44px;pointer-events:none;opacity:.9}
  #panel{position:absolute;left:16px;bottom:34px;width:440px;max-width:calc(100vw - 32px);
    background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px 10px;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .when{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  #stepName{font-size:18px;font-weight:600;color:var(--accent)}
  #paras{font-size:12px;color:var(--ink-dim);white-space:nowrap}
  #quoteEn{margin:6px 0 2px;font-size:15px;line-height:1.35;font-style:italic}
  #quoteKo{margin:0 0 4px;font-size:14px;line-height:1.4;color:#efe3cc;font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
  #meta{margin:0 0 8px;font-size:11.5px;color:var(--ink-dim);font-family:-apple-system,"Helvetica Neue",Arial,sans-serif}
  .controls{display:flex;align-items:center;gap:6px}
  .controls input[type=range]{flex:1;min-width:60px;accent-color:var(--accent);height:28px}
  button{font:600 12px -apple-system,"Helvetica Neue",Arial,sans-serif;color:#2a2420;background:#efe6d4;border:0;border-radius:6px;
    padding:7px 9px;cursor:pointer;white-space:nowrap}
  button:hover{background:#fff6e2}
  button.icon{width:30px;padding:7px 0}
  .ticks{display:flex;justify-content:space-between;margin:2px 36px 0 36px;font:11px -apple-system,"Helvetica Neue",Arial,sans-serif;color:var(--ink-dim)}
  .ticks span{cursor:pointer;flex:1;text-align:center}
  .ticks span.on{color:var(--accent);font-weight:700}
  .row2{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
  .legend{display:flex;gap:10px;flex-wrap:wrap;font:11px -apple-system,"Helvetica Neue",Arial,sans-serif;color:var(--ink-dim);margin-left:auto}
  .chip{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
  footer{position:absolute;left:16px;right:16px;bottom:8px;font:11px -apple-system,"Helvetica Neue",Arial,sans-serif;color:#d8cfbf;
    text-shadow:0 1px 2px rgba(0,0,0,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  footer a{color:var(--accent)}
  #msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;
    background:#1b1c20;color:var(--ink);font:16px/1.5 -apple-system,"Helvetica Neue",Arial,sans-serif;z-index:20}
  #msg div{max-width:520px}
  #err{position:absolute;right:8px;top:8px;max-width:min(460px,calc(100vw - 16px));display:none;z-index:30;
    background:#7a1f1f;color:#fff;font:12px/1.35 Menlo,monospace;padding:8px 10px;border-radius:6px;white-space:pre-wrap}
  #status{display:none}
  @media (max-width:640px){
    header{padding:8px 8px 18px}
    header h1{font-size:15px}
    header h1 .sub{font-size:12px}
    #compass{top:auto;bottom:auto;top:64px;width:36px;height:36px}
    #panel{left:8px;right:8px;width:auto;max-width:none;bottom:40px;padding:9px 10px 8px}
    #stepName{font-size:15px}
    #quoteEn{font-size:13px}
    #quoteKo{font-size:12.5px}
    #meta{display:none}
    .ticks{margin:2px 34px 0 34px;font-size:10px}
    .legend{display:none}
    .lbl{font-size:11px;padding:2px 5px 3px}
    .lbl small{display:none}
    .lbl.minor{font-size:10px}
    footer{white-space:normal;font-size:10px;bottom:4px;left:8px;right:8px}
  }
  /* ?ui=0: scene only (for slide pictures) */
  body.noui header, body.noui #panel, body.noui footer, body.noui #compass, body.noui #labels{display:none!important}
</style>
<script>
  // error overlay + status for headless checks (--dump-dom)
  window.__errors = [];
  function __report(msg){
    window.__errors.push(String(msg));
    var e = document.getElementById('err');
    if (e){ e.style.display='block'; e.textContent = 'Error: ' + window.__errors.join('\n'); }
    var s = document.getElementById('status'); if (s) s.textContent = 'errors: ' + JSON.stringify(window.__errors);
  }
  window.addEventListener('error', function(ev){ __report((ev.message||'resource error') + (ev.filename? ' @'+ev.filename+':'+ev.lineno:'')); }, true);
  window.addEventListener('unhandledrejection', function(ev){ __report('Promise: ' + (ev.reason && ev.reason.message || ev.reason)); });
  var __ce = console.error.bind(console);
  console.error = function(){ __report([].slice.call(arguments).join(' ')); __ce.apply(null, arguments); };
  setTimeout(function(){
    if (!window.__ready && !window.__noWebGL){
      var m=document.getElementById('msg');
      if(m){ m.style.display='flex'; m.innerHTML='<div><b>The 3D view could not start.</b><br>The three.js library is loaded from unpkg.com, so an internet connection is needed. Please check the connection and reload.</div>'; }
    }
  }, 15000);
</script>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<header>
  <h1>Covent Garden, 1830s — <span class="sub">a schematic 3D reconstruction from Dickens's 'The Streets—Morning' (prototype)</span></h1>
</header>
<svg id="compass" viewBox="-22 -22 44 44" aria-label="compass">
  <circle r="20" fill="rgba(24,22,20,.7)" stroke="rgba(255,255,255,.3)"/>
  <g id="needle"><path d="M0,-19 L5,-9 L-5,-9 Z" fill="#e2b866"/></g>
  <text id="nletter" x="0" y="4" text-anchor="middle" font-family="Georgia,serif" font-size="11" font-weight="700" fill="#efe6d6">N</text>
</svg>
<div id="panel" role="region" aria-label="Time of day">
  <div class="when"><span id="stepName">—</span><span id="paras"></span></div>
  <p id="quoteEn"></p>
  <p id="quoteKo"></p>
  <p id="meta"></p>
  <div class="controls">
    <button class="icon" id="prev" aria-label="Earlier">‹</button>
    <input id="slider" type="range" min="0" max="5" step="1" value="0" aria-label="Time step">
    <button class="icon" id="next" aria-label="Later">›</button>
  </div>
  <div class="ticks" id="ticks"></div>
  <div class="row2">
    <button id="play">▶ Play</button>
    <button id="reset">Reset view</button>
    <button id="closeBtn" title="Street-level close-up for this hour">Close-up</button>
    <button id="lblBtn">Labels: on</button>
    <div class="legend">
      <span><i class="chip" style="background:var(--market)"></i>market folk</span>
      <span><i class="chip" style="background:linear-gradient(90deg,var(--crowd1) 50%,var(--crowd2) 50%)"></i>noon crowd</span>
      <span><i class="chip" style="background:#3b4a78"></i>police</span>
    </div>
  </div>
</div>
<footer>Schematic, not to scale; figures ≈2× life size for legibility. Built from a prompt with an AI coding agent as a lecture prototype. Sources: see <a href="sources.md">sources.md</a></footer>
<div id="msg"></div>
<div id="err"></div>
<pre id="status">loading</pre>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------------- WebGL check ---------------- */
function hasWebGL(){
  try{ const c=document.createElement('canvas');
       return !!(window.WebGLRenderingContext && (c.getContext('webgl2')||c.getContext('webgl'))); }
  catch(e){ return false; }
}
function friendly(html){ const m=document.getElementById('msg'); m.style.display='flex'; m.innerHTML='<div>'+html+'</div>'; }
if (!hasWebGL()){
  window.__noWebGL = true;
  friendly('<b>This browser cannot show 3D graphics (WebGL is unavailable).</b><br>Try a recent Chrome, Safari or Firefox, or enable hardware acceleration. The screenshots in the slides show what the model looks like.');
  document.getElementById('status').textContent='no-webgl';
  throw new Error('__nowebgl');
}

/* ---------------- params ---------------- */
const Q = new URLSearchParams(location.search);
let step = Math.max(0, Math.min(5, parseInt(Q.get('t') ?? '0', 10) || 0));
let showLabels = Q.get('labels') !== '0';
const VIEW = Q.get('view') || 'default';
const SHOT = Q.get('shot') === '1';                    // headless screenshot mode: animation frozen
const NOUI = Q.get('ui') === '0';                       // scene only, no panel/labels (for slide pictures)
if (NOUI) document.body.classList.add('noui');
const CAMQ = (Q.get('cam')||'').split(',').map(Number); // optional camera: cam=x,y,z,tx,ty,tz
const TSQ = Q.has('ts') ? parseFloat(Q.get('ts')) : null; // optional frozen time within the step (s), for shots

/* ---------------- utilities ---------------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rng = mulberry32(1836);  // Sketches by Boz, first series 1836
const R = (a,b)=>a+(b-a)*rng();
const pick = arr => arr[Math.floor(rng()*arr.length)];

/* ---------------- renderer / scene ---------------- */
const app = document.getElementById('app');
let renderer;
try{
  renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
}catch(e){
  window.__noWebGL = true;
  friendly('<b>3D graphics could not be started on this device.</b><br>'+String(e.message||e));
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.setSize(app.clientWidth, app.clientHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x2a3350, 75, 190);

const camera = new THREE.PerspectiveCamera(38, Math.max(1,app.clientWidth)/Math.max(1,app.clientHeight), 0.5, 1200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI*0.47;
controls.minDistance = 2.5;   // v2: allow street-level close-ups
controls.maxDistance = 220;

/* sky dome */
const skyU = { top:{value:new THREE.Color(0x0b1430)}, bottom:{value:new THREE.Color(0x2a3350)} };
const sky = new THREE.Mesh(new THREE.SphereGeometry(600, 32, 16), new THREE.ShaderMaterial({
  uniforms: skyU, side: THREE.BackSide, depthWrite:false, fog:false,
  vertexShader:`varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
  fragmentShader:`uniform vec3 top; uniform vec3 bottom; varying vec3 vP;
    void main(){ float h = clamp(vP.y*1.6+0.08, 0.0, 1.0); gl_FragColor = vec4(mix(bottom, top, pow(h,0.8)), 1.0); }`
}));
scene.add(sky);

/* lights */
const hemi = new THREE.HemisphereLight(0x8899cc, 0x2a2622, 0.6);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 2.0);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -75; sun.shadow.camera.right = 75;
sun.shadow.camera.top = 75; sun.shadow.camera.bottom = -75;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 400;
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.03;
scene.add(sun); scene.add(sun.target);
const fill = new THREE.DirectionalLight(0x9fb0ff, 0.0);  // night/moon fill
fill.position.set(-40, 80, 30);
scene.add(fill);

/* ---------------- materials & textures ---------------- */
const matCache = new Map();
function M(color, opts={}){
  const key = color + JSON.stringify(opts, (k,v)=> (v && v.isTexture) ? v.uuid : v);
  if (!matCache.has(key)) matCache.set(key, new THREE.MeshStandardMaterial({color, roughness:0.9, metalness:0, ...opts}));
  return matCache.get(key);
}
function canvasTex(w,h,draw){
  const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'), w, h);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.anisotropy = 4; return t;
}
const trng = mulberry32(7);
// one bay x one storey of an upper facade: white base (tinted by material colour), window with stone surround
const upperBase = canvasTex(64,64,(g,w,h)=>{
  g.fillStyle='#ffffff'; g.fillRect(0,0,w,h);
  for(let i=0;i<70;i++){ g.fillStyle=`rgba(0,0,0,${trng()*0.07})`; g.fillRect(trng()*w, trng()*h, 7, 2); }
  g.fillStyle='#f4efe4'; g.fillRect(19,9,26,42);
  g.fillStyle='#2b2f37'; g.fillRect(22,12,20,36);
  g.fillStyle='#bdb5a4'; g.fillRect(31,12,2,36); g.fillRect(22,24,20,2); g.fillRect(22,36,20,2);
});
// ground-floor shop front
const shopBase = canvasTex(64,64,(g,w,h)=>{
  g.fillStyle='#ffffff'; g.fillRect(0,0,w,h);
  g.fillStyle='#3a3026'; g.fillRect(6,18,36,40);
  g.fillStyle='#8f8676'; g.fillRect(6,18,36,3); g.fillRect(23,21,2,37);
  g.fillStyle='#2a221c'; g.fillRect(46,22,12,36);
});
const texCache = new Map();
function texFor(base, rx, ry){
  const k = base.uuid+':'+rx+':'+ry;
  if(!texCache.has(k)){ const t = base.clone(); t.repeat.set(rx, ry); t.needsUpdate = true; texCache.set(k, t); }
  return texCache.get(k);
}
// paving setts
const setts = canvasTex(256,256,(g,w,h)=>{
  g.fillStyle='#7e7668'; g.fillRect(0,0,w,h);
  const r=mulberry32(11);
  for(let y=0;y<h;y+=16){ const off=(y/16)%2?12:0;
    for(let x=-24;x<w;x+=24){ const v=Math.floor(105+r()*40); g.fillStyle=`rgb(${v+8},${v+2},${v-10})`; g.fillRect(x+off+1,y+1,22,14); } }
});
setts.repeat.set(14, 11);

const C = {
  brick:['#8c5d46','#9a6a4f','#7f5442','#a07457','#8a6450'],
  stucco:['#cbb995','#d6c7a6','#bfae8c'],
  stone:'#cdbd9c', stoneDark:'#a99a7e', slate:'#555a62', church:'#a5725a', churchRoof:'#6b5848',
  granite:'#a9a59b', yellowBrick:'#c6ab76', shop:'#4b3d30', filler:['#5a524c','#625850','#564e49','#675c54']
};

/* ---------------- geometry helpers ---------------- */
const unitBox = new THREE.BoxGeometry(1,1,1);
function box(parent, w,h,d, x,y,z, mat, {cast=true, recv=true}={}){
  const m = new THREE.Mesh(unitBox, mat);
  m.scale.set(w,h,d); m.position.set(x, y+h/2, z);
  m.castShadow=cast; m.receiveShadow=recv; parent.add(m); return m;
}
const roofGeoCache = new Map();
function roofGeo(span, len, h){ // ridge along X
  const k=[span,len,h].map(v=>v.toFixed(2)).join(',');
  if(!roofGeoCache.has(k)){
    const s=new THREE.Shape(); s.moveTo(-span/2,0); s.lineTo(span/2,0); s.lineTo(0,h); s.closePath();
    const g=new THREE.ExtrudeGeometry(s,{depth:len, bevelEnabled:false});
    g.translate(0,0,-len/2); g.rotateY(Math.PI/2);
    roofGeoCache.set(k,g);
  }
  return roofGeoCache.get(k);
}
function roof(parent, span, len, h, x,y,z, mats){
  const m=new THREE.Mesh(roofGeo(span,len,h), mats);
  m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; parent.add(m); return m;
}

/* ---------------- world ---------------- */
const PIERS = [];   // v2: arcade piers in world x,z (obstacles for figures)
function collectPiers(g){ g.updateMatrixWorld(true); for(const v of (g.userData.piers||[])){ v.applyMatrix4(g.matrixWorld); PIERS.push([v.x, v.z]); } }
const world = new THREE.Group(); scene.add(world);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(500,500), M('#55514b'));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; world.add(ground);
// piazza paving: x[-21.5,21], z[-15.8,15.8]  (1 unit ≈ 10 ft; piazza ≈ 420 × 316 ft per 1670 charter)
const PZ = {x0:-21.5, x1:21, z0:-15.8, z1:15.8};
const paving = new THREE.Mesh(new THREE.PlaneGeometry(PZ.x1-PZ.x0, PZ.z1-PZ.z0), M('#ffffff',{map:setts}));
paving.rotation.x=-Math.PI/2; paving.position.set((PZ.x0+PZ.x1)/2, 0.02, 0); paving.receiveShadow=true; world.add(paving);

/* lit windows (rushlight, ¶3) */
const litMat = new THREE.MeshBasicMaterial({color:0xffc56b, transparent:true, opacity:1, toneMapped:false});
const litPlane = new THREE.PlaneGeometry(1,1);
const litWindows = [];

/* row of houses in local frame: runs along +x from 0, front face at z=0 facing +z, depth back to -depth */
const BW = 1.4, AH = 2.5, FH = 1.6, AD = 1.3;
function houseRow(group, segs, depth=4){
  let x = 0;
  for(const s of segs){
    if (s.gap){ x += s.gap; continue; }
    const w = s.w, bays = Math.max(1, Math.round(w/BW)), floors = s.floors ?? 2;
    const col = s.color ?? pick(C.brick);
    const upperH = floors*FH;
    const cx = x + w/2;
    const upperMat = [M(col), M(col), M(col), M(col), M(col,{map:texFor(upperBase,bays,floors)}), M(col)];
    if (s.arcade){
      box(group, w, AH, depth-AD, cx, 0, -AD-(depth-AD)/2, [M(C.shop),M(C.shop),M(C.shop),M(C.shop),M('#c9bba0',{map:texFor(shopBase,bays,1)}),M(C.shop)]);
      for(let i=0;i<=bays;i++){
        const px = x + i*(w/bays);
        box(group, 0.34, AH, 0.34, Math.min(Math.max(px, x+0.17), x+w-0.17), 0, -0.17, M(C.stone));
        (group.userData.piers ||= []).push(new THREE.Vector3(Math.min(Math.max(px, x+0.17), x+w-0.17), 0, -0.17));
      }
      box(group, w, 0.18, AD, cx, AH-0.18, -AD/2, M(C.stoneDark), {cast:false});
      box(group, w, 0.22, 0.12, cx, AH-0.05, 0.02, M(C.stone), {cast:false});
    } else {
      box(group, w, AH, depth, cx, 0, -depth/2, [M(col),M(col),M(col),M(col),M('#c9bba0',{map:texFor(shopBase,bays,1)}),M(col)]);
    }
    box(group, w, upperH, depth, cx, AH, -depth/2, upperMat);
    box(group, w+0.08, 0.14, depth+0.1, cx, AH+upperH, -depth/2, M(C.stone), {cast:false});
    const rh = s.roofH ?? 1.3;
    roof(group, depth, w, rh, cx, AH+upperH+0.14, -depth/2, [M(C.slate), M(C.slate)]);
    // chimney stacks at party walls
    if (!s.noChimney){
      box(group, 0.45, 1.1, 0.9, x+0.25, AH+upperH, -depth/2, M('#7a5040'));
    }
    // a few lit windows (night only)
    for(let b=0;b<bays;b++) for(let f=0;f<floors;f++){
      if (trng() < (s.lit ?? 0.06)){
        const m = new THREE.Mesh(litPlane, litMat.clone());
        m.scale.set((w/bays)*20/64, FH*36/64, 1);
        m.position.set(x + (b+0.5)*(w/bays), AH + (f + 1 - 30/64)*FH, 0.02);
        m.userData.phase = trng()*10; group.add(m); litWindows.push(m);
      }
    }
    x += w;
  }
  return x;
}

function mergeRig(parts){
  let nv=0, ni=0;
  for(const p of parts){ const c=p.g.attributes.position.count; nv+=c; ni += p.g.index ? p.g.index.count : c; }
  const pos=new Float32Array(nv*3), nor=new Float32Array(nv*3), cl=new Float32Array(nv*3), rig=new Float32Array(nv*4), rig2=new Float32Array(nv*4);
  const idx = nv>65535 ? new Uint32Array(ni) : new Uint16Array(ni);
  const v=new THREE.Vector3(), n=new THREE.Vector3(), nm=new THREE.Matrix3();
  let vo=0, io=0;
  for(const p of parts){
    const P=p.g.attributes.position, Nn=p.g.attributes.normal, cnt=P.count;
    nm.getNormalMatrix(p.m);
    for(let i=0;i<cnt;i++){
      v.fromBufferAttribute(P,i); const lx=v.x, ly=v.y, lz=v.z; v.applyMatrix4(p.m);
      n.fromBufferAttribute(Nn,i).applyMatrix3(nm).normalize();
      const o3=(vo+i)*3, o4=(vo+i)*4;
      pos[o3]=v.x; pos[o3+1]=v.y; pos[o3+2]=v.z; nor[o3]=n.x; nor[o3+1]=n.y; nor[o3+2]=n.z;
      let c=p.col, slot=p.slot, mul=p.mul;
      if(p.vfn){ const r=p.vfn(lx,ly,lz); if(r){ if(r.c) c=r.c; if(r.slot!==undefined) slot=r.slot; if(r.mul!==undefined) mul=r.mul; } }
      cl[o3]=c.r*mul; cl[o3+1]=c.g*mul; cl[o3+2]=c.b*mul;
      rig[o4]=p.limb; rig[o4+1]=slot; rig[o4+2]=p.piv[0]; rig[o4+3]=p.piv[1];
      rig2[o4]=p.k[0]; rig2[o4+1]=p.k[1]; rig2[o4+2]=p.k[2]; rig2[o4+3]=p.k[3];
    }
    if(p.g.index){ const I=p.g.index; for(let k=0;k<I.count;k++) idx[io+k]=I.getX(k)+vo; io+=I.count; }
    else { for(let k=0;k<cnt;k++) idx[io+k]=vo+k; io+=cnt; }
    vo+=cnt;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('normal', new THREE.BufferAttribute(nor,3));
  g.setAttribute('color', new THREE.BufferAttribute(cl,3));
  g.setAttribute('aRig', new THREE.BufferAttribute(rig,4));
  g.setAttribute('aRig2', new THREE.BufferAttribute(rig2,4));
  g.setIndex(new THREE.BufferAttribute(idx,1));
  g.computeBoundingSphere();

}
// two-link leg: knee position (in the z–y plane) for hip H and ankle A, knee bending forward/up
function knee2(H, A, l1, l2){
  const dz=A[0]-H[0], dy=A[1]-H[1], d=Math.min(Math.hypot(dz,dy), l1+l2-1e-4);
  const a=(l1*l1-l2*l2+d*d)/(2*d), h=Math.sqrt(Math.max(0,l1*l1-a*a));
  const pz=H[0]+a*dz/d, py=H[1]+a*dy/d, nz=-dy/d, ny=dz/d;
  const k1=[pz+h*nz, py+h*ny], k2=[pz-h*nz, py-h*ny];
  return k1[1]>k2[1] ? k1 : k2;
}

// loads (deterministic per variant)
function heap(R, cx, cz, rx, rz, h, y0, lr, cr=0.135){
  R.add(gHemi(12,5), TRS([cx,y0,cz], null, [rx,h,rz]), {slot:3, mul:0.6});
  for (let gx=-rx+cr; gx<=rx-cr*0.8; gx+=cr*1.8) for (let gz=-rz+cr; gz<=rz-cr*0.8; gz+=cr*1.8){
    const jx=gx+(lr()-0.5)*0.06, jz=gz+(lr()-0.5)*0.06, e=1-(jx/rx)**2-(jz/rz)**2;
    if (e<0.04) continue;
    R.add(gSph(7,5), TRS([cx+jx, y0+h*Math.sqrt(e)+0.015, cz+jz], [lr(),lr(),0], [cr*(0.9+lr()*0.25), cr*0.82, cr*(0.9+lr()*0.25)]), {slot:3, mul:0.82+lr()*0.38});
  }
}
function basketGrid(R, xr, zr, y0, layers, lr, br=0.21, bh=0.28){
  const st=br*2.06;
  for (let l=0;l<layers;l++){
    const ins = l===0 ? 0 : br*0.35*l, w=xr[1]-xr[0]-2*ins, d=zr[1]-zr[0]-2*ins;
    const nx=Math.max(1, Math.floor((w-2*br)/st+1e-6)+1), nz=Math.max(1, Math.floor((d-2*br)/st+1e-6)+1);
    const x0=(xr[0]+xr[1])/2-(nx-1)*st/2, z0=(zr[0]+zr[1])/2-(nz-1)*st/2;
    for (let ix=0; ix<nx; ix++) for (let iz=0; iz<nz; iz++){
      const yb=y0+l*bh, xx=x0+ix*st+(lr()-0.5)*0.02, zz=z0+iz*st+(lr()-0.5)*0.02;
      R.tube([xx,yb,zz], [xx,yb+bh,zz], br*0.86, br, {c:WICKER[Math.floor(lr()*4)], mul:0.85+lr()*0.3}, 9);
      R.ell([xx,yb+bh-0.005,zz], [br*0.9,0.06,br*0.9], {slot:3, mul:0.75+lr()*0.45}, [8,3]);
    }
  }
  return y0 + layers*bh;
}
function sackRow(R, xr, zr, y0, lr, layers=2){
  const r=0.17;
  for (let l=0;l<layers;l++) for (let z=zr[0]+r+l*0.14; z<=zr[1]-r+1e-6; z+=r*2.05)
    R.add(gCap(1,2.2,3,8), TRS([(xr[0]+xr[1])/2+(lr()-0.5)*0.08, y0+r*0.85+l*r*1.55, z], [0,lr()*0.3-0.15,Math.PI/2], [r,Math.min(1,(xr[1]-xr[0])/(4.2*r))*r,r]), {c:'#9b8560', mul:0.82+lr()*0.3});
}

function inRects(x,z,r){
  for (const q of RECTS) if (x>q[0]-r && x<q[1]+r && z>q[2]-r && z<q[3]+r) return true;
  for (const q of FILLER) if (x>q[0]-r && x<q[1]+r && z>q[2]-r && z<q[3]+r) return true;
  return false;
}
const OCC = new Map();
function occCells(sh, fn){
  const i0=Math.floor(Math.min(sh.x0,sh.x1)-sh.r), i1=Math.floor(Math.max(sh.x0,sh.x1)+sh.r), j0=Math.floor(Math.min(sh.z0,sh.z1)-sh.r), j1=Math.floor(Math.max(sh.z0,sh.z1)+sh.r);
  for (let i=i0;i<=i1;i++) for (let j=j0;j<=j1;j++) if (fn(i*4096+j)) return true;
  return false;
}
function segDist(a, b){   // distance between two 2D segments
  const d1x=a.x1-a.x0, d1z=a.z1-a.z0, d2x=b.x1-b.x0, d2z=b.z1-b.z0, rx=a.x0-b.x0, rz=a.z0-b.z0;
  const A=d1x*d1x+d1z*d1z, E=d2x*d2x+d2z*d2z, F=d2x*rx+d2z*rz;
  let s=0, t=0;
  if (A<1e-9 && E<1e-9) return Math.hypot(rx,rz);
  if (A<1e-9){ t=Math.min(1,Math.max(0,F/E)); }
  else { const C=d1x*rx+d1z*rz;
    if (E<1e-9){ s=Math.min(1,Math.max(0,-C/A)); }
    else { const B=d1x*d2x+d1z*d2z, den=A*E-B*B;
      s = den>1e-9 ? Math.min(1,Math.max(0,(B*F-C*E)/den)) : 0;
      t=(B*s+F)/E;
      if (t<0){ t=0; s=Math.min(1,Math.max(0,-C/A)); } else if (t>1){ t=1; s=Math.min(1,Math.max(0,(B-C)/A)); } } }
  return Math.hypot(rx+d1x*s-d2x*t, rz+d1z*s-d2z*t);
}
function occHit(sh){ return occCells(sh, k=>{ const a=OCC.get(k); if(!a) return false; for (const o of a) if ((o.m & sh.m) && !(sh.g && o.g===sh.g) && segDist(sh,o) < sh.r+o.r) return true; return false; }); }
function occAdd(sh){ const seen=new Set(); occCells(sh, k=>{ if(seen.has(k)) return false; seen.add(k); let a=OCC.get(k); if(!a) OCC.set(k, a=[]); a.push(sh); return false; }); }
function shapeBlocked(sh){
  const n=Math.max(1, Math.ceil(Math.hypot(sh.x1-sh.x0, sh.z1-sh.z0)/0.3));
  for (let i=0;i<=n;i++){ const t=i/n; if (inRects(sh.x0+(sh.x1-sh.x0)*t, sh.z0+(sh.z1-sh.z0)*t, sh.r)) return true; }
  return false;
}

{ const cnt={}; for (const p of PEOPLE) cnt[p.arch]=(cnt[p.arch]||0)+1;

/* ---------- writing instances ---------- */
const _m=new THREE.Matrix4(), _m2=new THREE.Matrix4(), _m3=new THREE.Matrix4(), _q=new THREE.Quaternion(), _q2=new THREE.Quaternion(), _e=new THREE.Euler();
const _p=new THREE.Vector3(), _p2=new THREE.Vector3(), _s=new THREE.Vector3(), _s2=new THREE.Vector3(), _X=new THREE.Vector3(1,0,0), _Yv=new THREE.Vector3(0,1,0);
function writePerson(pool, i, p){
  const A=ARCH[p.arch];
  pool.setCol('iColA', i, p.cols[0]); pool.setCol('iColB', i, p.cols[1]); pool.setCol('iColC', i, p.cols[2]); pool.setCol('iColD', i, p.cols[3]);
  pool.A.iAnim.setXYZW(i, p.mode, p.t0, p.v, p.L);
  pool.A.iMisc.setXYZW(i, p.skin, p.sway, A.stride, A.knee);
}
function writePeople(s){
  const bit=1<<s;
  for (const k in PPOOL) PPOOL[k].begin();
  for (const p of PEOPLE){
    if (!(p.mask & bit)) continue;
    const pool=PPOOL[p.arch], i=pool.next();
    _e.set(0, p.rot, p.tilt, 'YXZ'); _q.setFromEuler(_e);
    _p.set(p.x, GY+p.y, p.z); _s.setScalar(WPM*p.sc);
    _m.compose(_p, _q, _s); pool.mesh.setMatrixAt(i, _m);
    writePerson(pool, i, p);
  }
}
// roll-in profile: constant speed, easing to a stop over the last 15 %. Writes ROLL_TR (distance rolled) and ROLL_SP (0..1)
let ROLL_TR=0, ROLL_SP=0;
function rollAt(c, ts){
  const r=c.roll, a=0.85, k=2/(1+a), T=r.D*k/r.v, u=Math.min(1, Math.max(0, (ts-r.delay)/T));
  ROLL_TR = r.D*(u<=a ? k*u : 1-k*(1-u)*(1-u)/(2*(1-a)));
  ROLL_SP = ts<r.delay ? 0 : (u<=a ? 1 : (1-u)/(1-a));
}
const MOVERS=[];
function placeCart(c, tr, spd, first){
  const back = c.roll ? c.roll.D-tr : 0;
  _p.set(c.x-c.dx*back, GY, c.z-c.dz*back); _q.setFromAxisAngle(_Yv, c.rot); _s.setScalar(WPM);
  _m.compose(_p, _q, _s);
  c.body.mesh.setMatrixAt(c.iBody, _m);
  const dm = (c.roll ? tr-c.roll.D : 0)/WPM;   // metres rolled (0 at the parking place)
  for (let k=0;k<c.wheels.length;k++){
    const w=c.wheels[k];
    _p2.set(w.x, w.r, w.z); _q2.setFromAxisAngle(_X, w.a0 + dm/w.r); _s2.set(1, w.r, w.r);
    _m2.compose(_p2, _q2, _s2); _m3.multiplyMatrices(_m, _m2); WHEELS.mesh.setMatrixAt(c.iWheels[k], _m3);
  }
  for (let k=0;k<c.animals.length;k++){
    const a=c.animals[k];
    _m2.makeTranslation(0, 0, a.z); _m3.multiplyMatrices(_m, _m2); a.pool.mesh.setMatrixAt(c.iAnim[k], _m3);
    a.pool.A.iGait.setXYZW(c.iAnim[k], dm/a.stride + a.ph0, spd, a.seed, 0);
    if (first){ const cc=a.pool.A.iColA, cb=a.pool.A.iColB, A=col(a.cols[0]), B=col(a.cols[1]); cc.setXYZ(c.iAnim[k], A.r, A.g, A.b); cb.setXYZ(c.iAnim[k], B.r, B.g, B.b); }
  }
  for (const r of c.riders){
    if (r.i<0) continue;
    _p2.set(r.x, r.y, r.z); _q2.setFromAxisAngle(_Yv, r.rot); _s2.set(1,1,1);
    _m2.compose(_p2, _q2, _s2); _m3.multiplyMatrices(_m, _m2); PPOOL[r.arch].mesh.setMatrixAt(r.i, _m3);
  }
}
function writeCarts(s, ts){
  const bit=1<<s;
  for (const p of CART_POOLS) p.begin();
  MOVERS.length=0;
  for (const pass of [0,1]) for (const c of CARTS){       // moving carts first
    if (!(c.mask & bit)) continue;
    const moving = s===2 && !!c.roll;
    if ((pass===0) !== moving) continue;
    c.iBody=c.body.next(); c.iWheels=c.wheels.map(()=>WHEELS.next()); c.iAnim=c.animals.map(a=>a.pool.next());
    const cc=c.cols; c.body.setCol('iColA', c.iBody, cc[0]); c.body.setCol('iColB', c.iBody, cc[1]); c.body.setCol('iColC', c.iBody, cc[2]);
    for (const i of c.iWheels){ WHEELS.setCol('iColA', i, cc[0]); WHEELS.setCol('iColB', i, cc[1]); WHEELS.setCol('iColC', i, cc[2]); }
    for (const r of c.riders){
      r.i=-1;
      if (!r.steps.includes(s)) continue;
      const pool=PPOOL[r.arch]; r.i=pool.next();
      writePerson(pool, r.i, r.p || (r.p={arch:r.arch, cols:colorsFor(r.arch,false), skin:AR(0.1,0.6), mode:0, t0:AR(0,20), v:1, L:0, sway:0.008}));
    }
    if (moving){ MOVERS.push(c); rollAt(c, ts); c.lastTr=ROLL_TR; placeCart(c, ROLL_TR, ROLL_SP, true); }
    else placeCart(c, c.roll ? c.roll.D : 0, 0, true);
  }

}
function updateMovers(ts){
  if (!MOVERS.length) return;
  let any=false;
  for (const c of MOVERS){
    rollAt(c, ts);
    if (ROLL_TR===c.lastTr && ROLL_SP===0) continue;
    c.lastTr=ROLL_TR; any=true; placeCart(c, ROLL_TR, ROLL_SP, false);
  }
  if (any){ for (const p of CART_POOLS) p.motion(); for (const c of MOVERS) for (const r of c.riders) if (r.i>=0) PPOOL[r.arch].motion(); }
}
function writeFigures(s, ts){
  writePeople(s);

}

function figTris(s){

}

// sun position: London 51.5°N, midsummer (δ = +23.44°), local solar time — an assumption (Dickens: "a summer's morning")
function sunDir(solarHour){
  const d2r=Math.PI/180, phi=51.51*d2r, dec=23.44*d2r, H=(solarHour-12)*15*d2r;
  const alt=Math.asin(Math.sin(phi)*Math.sin(dec)+Math.cos(phi)*Math.cos(dec)*Math.cos(H));
  const azS=Math.atan2(Math.sin(H), Math.cos(H)*Math.sin(phi)-Math.tan(dec)*Math.cos(phi)); // from south, +west
  const azN=azS+Math.PI;
  return {alt, azN, v:new THREE.Vector3(Math.cos(alt)*Math.sin(azN), Math.sin(alt), -Math.cos(alt)*Math.cos(azN))};
}
function fmtSolar(h){ const H=Math.floor(h), m=Math.round((h-H)*60); return H+':'+String(m).padStart(2,'0'); }

const tmpM=new THREE.Matrix4(), tmpQ=new THREE.Quaternion(), tmpE=new THREE.Euler(), tmpP=new THREE.Vector3(), tmpS=new THREE.Vector3();
const clock=new THREE.Clock();
let stepT0=0;
const SHOT_TS=[6, 6, 13, 6, 6, 6];   // frozen time within each step for ?shot=1 (carts at +1 h are half-way in)
const SHOT_T=3.3;
function applyStep(s){
  step=s; const S=STEPS[s];
  skyU.top.value.set(S.skyTop); skyU.bottom.value.set(S.skyBot);
  scene.fog.color.set(S.skyBot);
  hemi.color.set(S.hemiSky); hemi.groundColor.set(S.hemiGnd); hemi.intensity=S.hemiI;
  fill.intensity=S.fillI;
  renderer.toneMappingExposure=S.exposure;
  const sd=sunDir(S.solar);
  sun.color.set(S.sunCol);
  sun.intensity = sd.alt>0 ? S.sunI : 0;
  sun.castShadow = sd.alt>0;
  sun.position.copy(sd.v).multiplyScalar(160).add(new THREE.Vector3(-2,0,0));
  sun.target.position.set(-2,0,0);
  lamps.forEach(l=>{ l.visible=S.lamps>0; l.material.opacity=S.lamps; });
  lampHeadMat.emissiveIntensity = S.lamps>0 ? 2.2*S.lamps : 0;
  litWindows.forEach(w=>{ w.visible=S.lit>0; });
  crates.forEach(c=>{ c.visible = s>=2; });
  tables.forEach(t=>{ t.visible = (s===2||s===3); });
  sweepStep.visible = s===2;
  // figures (people, carts, horses); time within the step restarts so that carts roll in again
  stepT0 = clock.getElapsedTime();
  U.uStepTime.value = SHOT ? (TSQ ?? SHOT_TS[s]) : 0;
  writeFigures(s, U.uStepTime.value);
  // litter
  const nL = s===2 ? 45 : s===3 ? litter.length : 0; let kl=0;
  for(let i=0;i<litter.length && kl<nL;i++){ const L=litter[i]; if(s===2 && !L.early) continue;
    tmpE.set(0,L.r,0); tmpQ.setFromEuler(tmpE); tmpP.set(L.x,0.04,L.z); tmpM.compose(tmpP,tmpQ,tmpS.set(L.s,1,L.s*0.7));
    litterMesh.setMatrixAt(kl, tmpM); litterMesh.setColorAt(kl, L.c); kl++; }
  litterMesh.count=kl; litterMesh.instanceMatrix.needsUpdate=true; if(litterMesh.instanceColor) litterMesh.instanceColor.needsUpdate=true;
  // caption
  document.getElementById('stepName').textContent=S.name;
  document.getElementById('paras').textContent=S.para;
  document.getElementById('quoteEn').textContent=S.en;
  document.getElementById('quoteKo').textContent=S.ko;
  const altDeg = Math.round(sd.alt*180/Math.PI);
  document.getElementById('meta').textContent = NOTES[s] + '  Sun ' + (altDeg>=0? '≈'+altDeg+'° up' : '≈'+(-altDeg)+'° below horizon') + ' (assumed midsummer, solar time ≈ '+fmtSolar(S.solar)+').';
  document.getElementById('slider').value=s;
  document.querySelectorAll('#ticks span').forEach((el,i)=>el.classList.toggle('on', i===s));
}

const pv=new THREE.Vector3();
const TOPMIN = 62;
function updateLabels(){
  labelLayer.style.display = showLabels ? '' : 'none';
  if(!showLabels) return;
  const W=app.clientWidth, H=app.clientHeight, placed=[];
  if(!W || !H) return;
  const sorted=[...LABELS].sort((a,b)=>a.pr-b.pr);
  for(const L of sorted){
    pv.copy(L.v).project(camera);
    const vis = pv.z<1 && pv.x>-1.1 && pv.x<1.1 && pv.y>-1.1 && pv.y<1.1;
    if(!vis){ L.el.style.display='none'; L.stem.style.display='none'; L.dot.style.display='none'; continue; }
    const ax=(pv.x*0.5+0.5)*W, ay=(-pv.y*0.5+0.5)*H;
    let stemLen = L.minor ? 0 : 18, x, y, ok=false;
    for(let tries=0; tries<7; tries++){
      x = Math.min(Math.max(ax - L.w/2, 6), W - L.w - 6);
      y = L.minor ? ay - L.h/2 : Math.max(ay - stemLen - L.h, TOPMIN);
      const r={x0:x-3,y0:y-3,x1:x+L.w+3,y1:y+L.h+3};
      if(!placed.some(q=>r.x0<q.x1&&r.x1>q.x0&&r.y0<q.y1&&r.y1>q.y0)){ ok=true; placed.push(r); break; }
      if(L.minor) break;
      stemLen += L.h*0.7;
    }
    if(!ok && L.minor){ L.el.style.display='none'; continue; }
    if(!ok){ placed.push({x0:x,y0:y,x1:x+L.w,y1:y+L.h}); }
    L.el.style.display=''; L.el.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`;
    if(!L.minor){
      L.stem.style.display=''; L.dot.style.display='';
      const lb=y+L.h, st=Math.min(ay, lb), sh=Math.abs(ay-lb);
      L.stem.style.transform=`translate(${ax.toFixed(1)}px,${st.toFixed(1)}px)`; L.stem.style.height=sh+'px';
      L.dot.style.transform=`translate(${ax.toFixed(1)}px,${ay.toFixed(1)}px)`;
    }
  }
}

function defaultView(){
  const aspect = Math.max(1,app.clientWidth)/Math.max(1,app.clientHeight);
  const k = aspect<1 ? Math.min(2.1, 1.0/Math.pow(aspect,0.85)) : 1;
  const target=new THREE.Vector3(-6,0,0);
  const off=new THREE.Vector3(30, 72, 54).multiplyScalar(k*1.12);
  if(VIEW==='top'){ return {pos:new THREE.Vector3(-3, 110*k, 4), target:new THREE.Vector3(-3,0,0)}; }
  if(VIEW==='portico'){ return {pos:new THREE.Vector3(-2, 6, 12), target:new THREE.Vector3(-19,4,0)}; }
  if(VIEW==='close'){ return {pos:new THREE.Vector3(-1, 15, 17).multiplyScalar(aspect<1?1.25:1), target:new THREE.Vector3(-15,1.5,-1)}; }
  return {pos:target.clone().add(off), target};
}

const lblBtn=document.getElementById('lblBtn');
lblBtn.textContent = 'Labels: '+(showLabels?'on':'off');
lblBtn.onclick=()=>{ showLabels=!showLabels; lblBtn.textContent='Labels: '+(showLabels?'on':'off'); if(showLabels){ labelLayer.style.display=''; measureLabels(); } };
let playTimer=null; const playBtn=document.getElementById('play');
playBtn.onclick=()=>{
  if(playTimer){ clearInterval(playTimer); playTimer=null; playBtn.textContent='▶ Play'; return; }
  playBtn.textContent='❚❚ Pause'; if(step===5) applyStep(0);
  playTimer=setInterval(()=>{ if(step>=5){ clearInterval(playTimer); playTimer=null; playBtn.textContent='▶ Play'; return; } applyStep(step+1); }, 2600);
};
window.addEventListener('keydown', e=>{ if(e.key==='ArrowRight') applyStep(Math.min(5,step+1)); if(e.key==='ArrowLeft') applyStep(Math.max(0,step-1)); });

function onResize(){
  const w=Math.max(1,app.clientWidth), h=Math.max(1,app.clientHeight);
  renderer.setSize(w,h); camera.aspect=w/h;
  // keep the model clear of the caption panel: shift the image right/up on wide screens, up on phones
  if (NOUI) camera.clearViewOffset();
  else if (w>640) camera.setViewOffset(w, h, -Math.min(170, w*0.12), Math.min(30, h*0.03), w, h);
  else camera.setViewOffset(w, h, 0, Math.min(150, h*0.17), w, h);
  camera.updateProjectionMatrix(); measureLabels();
}
window.addEventListener('resize', onResize);

/* compass */
const needle=document.getElementById('needle'), nletter=document.getElementById('nletter');
const cA=new THREE.Vector3(), cB=new THREE.Vector3();
function updateCompass(){
  cA.copy(controls.target).project(camera); cB.copy(controls.target).add(new THREE.Vector3(0,0,-10)).project(camera);
  const ang=Math.atan2((cB.x-cA.x)*app.clientWidth, (cB.y-cA.y)*app.clientHeight)*180/Math.PI;
  if(Number.isFinite(ang)) needle.setAttribute('transform', `rotate(${ang.toFixed(1)})`);
}

/* ---------------- start ---------------- */
onResize();
applyStep(step);
setView(startView(), false);
function loop(){
  const t=clock.getElapsedTime();
  if(SHOT){ U.uTime.value=SHOT_T; } else { U.uTime.value=t; U.uStepTime.value=t-stepT0; }
  updateMovers(U.uStepTime.value);
  if(tween){ const u=Math.min(1,(performance.now()-tween.t0)/tween.dur), e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
    camera.position.lerpVectors(tween.p0,tween.p1,e); controls.target.lerpVectors(tween.t0v,tween.t1v,e); if(u>=1) tween=null; }
  controls.update();
  { const d=camera.position.distanceTo(controls.target), k=Math.max(0,1-d/60);   // v2: lighter fog for street-level views; overview as v1
    scene.fog.near=d*0.95+8*k; scene.fog.far=d*2.6+45*k; }
  if(STEPS[step].lit>0){ for(const w of litWindows){ w.material.opacity = STEPS[step].lit*(0.75+0.25*Math.sin(t*7+w.userData.phase)); } }
  renderer.render(scene,camera);
  updateLabels(); updateCompass();
  if(SHOT){ if(++shotFrames < 4) setTimeout(loop, 30); else { const gl=renderer.getContext(); const px=new Uint8Array(4); gl.readPixels(Math.floor(gl.drawingBufferWidth/2), Math.floor(gl.drawingBufferHeight*0.8),1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);
      { const img=new Image(); img.src=renderer.domElement.toDataURL('image/png'); img.style.cssText='position:absolute;inset:0;width:100%;height:100%'; app.appendChild(img); renderer.domElement.style.visibility='hidden'; }
      document.getElementById('status').textContent += ' | shot-done px='+Array.from(px).join(',')+' lost='+gl.isContextLost()+' gl='+(gl.getParameter(gl.VERSION)); } return; }
  requestAnimationFrame(loop);
}
let shotFrames = 0;
window.__v2 = {CARTS, MOVERS, PEOPLE, U, applyStep, figTris, figCount};   // for console inspection / tests
if(Q.get('bench')==='1'){   // ?bench=1: time 120 frames (GPU synchronised), report in the status line; &nofig=1 hides figures
  if(Q.get('nofig')==='1'){ for(const p of [...Object.values(PPOOL), ...CART_POOLS]) p.mesh.visible=false; }
  const gl=renderer.getContext(), px=new Uint8Array(4), ft=[];
  for(let i=0;i<130;i++){ const t0=performance.now(); U.uTime.value=i/60; U.uStepTime.value=i/60; updateMovers(i/60); controls.update(); renderer.render(scene,camera); gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px); if(i>=10) ft.push(performance.now()-t0); }
  ft.sort((a,b)=>a-b);
  window.__bench='bench: median '+ft[ft.length>>1].toFixed(2)+' ms, p90 '+ft[Math.floor(ft.length*0.9)].toFixed(2)+' ms, calls '+renderer.info.render.calls+', tris '+renderer.info.render.triangles+', gpu '+(gl.getParameter(gl.getExtension('WEBGL_debug_renderer_info')?.UNMASKED_RENDERER_WEBGL ?? gl.RENDERER));
}
loop();
window.__ready = true;
const st=document.getElementById('status');
if(!window.__errors.length) st.textContent='ready: step '+step+', carts '+CARTS.length+', people(all steps) '+PEOPLE.length
  +', figures/step ['+[0,1,2,3,4,5].map(figCount).join(',')+'], figure tris/step ['+[0,1,2,3,4,5].map(figTris).join(',')+']'
  +(window.__bench ? ' | '+window.__bench : '')
  +(Q.get('dbg')==='1' ? ' | tris: '+Object.entries(PPOOL).map(([k,p])=>k+'='+p.tris+'x'+p.cap).join(' ')+' '+Object.entries(BODY).map(([k,p])=>k+'='+p.tris+'x'+p.cap).join(' ')+' wheel='+WHEELS.tris+'x'+WHEELS.cap+' horse='+HORSES.tris+'x'+HORSES.cap+' donkey='+DONKEYS.tris+'x'+DONKEYS.cap : '');
</script>
</body>
</html>
